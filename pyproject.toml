[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-sleep-stage-spectrogram-engine"
version = "2.0.0"
description = "SleepStage-AI: AASM Polysomnography Hypnogram Multi-Lead Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
eeg-sleep-stage-spectrogram-engine = "sleep_stage_ai.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/eeg-sleep-stage-spectrogram-engine"
Repository = "https://github.com/abusuraihsakhri/eeg-sleep-stage-spectrogram-engine.git"
