[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-sleep-stage-spectrogram-engine"
version = "2.0.0"
description = "SleepStage-AI: AASM Polysomnography Hypnogram Multi-Lead Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]\n\n[project.optional-dependencies]\napi = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]\ndev = ["pytest>=8,<10"]

[project.scripts]
eeg-sleep-stage-spectrogram-engine = "sleep_stage_ai.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/eeg-sleep-stage-spectrogram-agent"
Repository = "https://github.com/abusuraihsakhri/eeg-sleep-stage-spectrogram-agent.git"
\n[tool.setuptools.packages.find]\ninclude = ["agents*", "sleep_stage_ai*"]\n