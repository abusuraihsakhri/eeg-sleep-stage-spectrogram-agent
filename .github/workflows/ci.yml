name: Python and browser checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Compile and test
        run: |
          python -m compileall -q agents sleep_stage_ai
          pytest -q
      - name: Audit-chain sanity check
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax and spectral analysis tests
        run: |
          node --check web/spectrogram.js
          node --check web/app.js
          node --test tests/test_spectrogram.cjs
